spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms          
      connect-timeout: 500ms
  cache:
    type: redis
    redis:
      time-to-live: 60s      
      cache-null-values: false

server:
  error:
    include-message: always   

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    ttl-seconds: 3600         
  admin:                       
    email: admin@example.com
    password: admin12345
  holds:
    ttl-seconds: 600         
  rate-limit:
    login-per-minute: 10       
    booking-per-minute: 20    